[project]
name = "jepa-lptem"
version = "0.1.0"
description = "A latent world model for liquid-phase transmission electron microscopy (V-JEPA 2 adapted to LPTEM)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.2",
    "huggingface-hub>=1.23.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.3",
    "peft>=0.19.1",
    "pot>=0.9.7",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["gpu: requires CUDA (skipped locally, run explicitly on the remote)"]
addopts = "-m 'not gpu'"

[tool.hatch.build.targets.wheel]
packages = ["src/jepa_lptem"]
